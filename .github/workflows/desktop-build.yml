name: Desktop Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            artifact_name: macos
            # Keep artifact paths explicit to avoid hard-coded assumptions elsewhere.
            artifact_path: src-tauri/target/release/bundle/macos/*.app
          - os: windows-latest
            bundles: nsis
            artifact_name: windows
            artifact_path: src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cargo cache is intentionally disabled here because Windows linking has been
      # sensitive to stale artifacts in prior builds.
      # - name: Rust Cache
      #   uses: Swatinem/rust-cache@v2
      #   with:
      #     workspaces: src-tauri

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      # Extra safety: ensure Windows rebuilds from a clean target directory.
      - name: Clean Target (Windows)
        if: matrix.os == 'windows-latest'
        run: Remove-Item -Recurse -Force src-tauri/target -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build App (Windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=-crt-static
          CFLAGS: /MD
          CXXFLAGS: /MD
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --verbose

      - name: Build App (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --verbose

      # Package macOS output into a single zip artifact.
      - name: Prepare Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p artifacts
          # Fail early if the expected bundle was not produced.
          ls ${{ matrix.artifact_path }} || exit 1
          ditto -c -k --sequesterRsrc --keepParent ${{ matrix.artifact_path }} artifacts/neuralvault-macos.zip

      # Collect Windows installers and fail clearly if the build output is missing.
      - name: Prepare Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Verify that the expected executable was produced.
          $path = "${{ matrix.artifact_path }}"
          if (-not (Test-Path $path)) {
            Write-Error "Build artifact not found at $path"
            exit 1
          }
          Copy-Item $path artifacts
          # Copy the MSI only when it exists.
          if (Test-Path src-tauri/target/release/bundle/msi/*.msi) {
             Copy-Item src-tauri/target/release/bundle/msi/*.msi artifacts
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuralvault-${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
